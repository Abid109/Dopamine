name: Deploy website

# Publishes the web app (PWA) at the site root and the download page at /download/ on GitHub Pages.
# One-time setup: Settings, Pages, Source: GitHub Actions.

on:
  push:
    branches: [main, master]
    paths:
      - 'www/**'
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir _site
          cp -r www/. _site/
          mkdir _site/download
          cp site/download/index.html _site/download/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
