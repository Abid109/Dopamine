name: Build Dopamine APK

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'wiki/**'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - '.github/workflows/sync-wiki.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use the permanent signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error title=Signing key missing::Add the repository secret ANDROID_KEYSTORE_B64 (see the wiki page Updating the App). The build stops here so an APK signed with a random key is never published."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/dopamine.keystore"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/dopamine.keystore" >> "$GITHUB_ENV"
          keytool -list -keystore "$RUNNER_TEMP/dopamine.keystore" -storepass android -alias androiddebugkey | head -3

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Build the stylesheet
        run: npm run build:css

      - name: Add Android platform
        run: npx cap add android

      - name: Apply app icon and name
        run: |
          RES=android/app/src/main/res
          rm -f $RES/drawable-v24/ic_launcher_foreground.xml $RES/drawable/ic_launcher_background.xml
          rm -f $RES/mipmap-*/ic_launcher*.png $RES/mipmap-*/ic_launcher*.webp
          cp -r android-res/* $RES/
          sed -i 's|<string name="app_name">.*</string>|<string name="app_name">Dopamine</string>|; s|<string name="title_activity_main">.*</string>|<string name="title_activity_main">Dopamine</string>|' $RES/values/strings.xml

      - name: Set app version
        run: |
          N=${{ github.run_number }}
          G=android/app/build.gradle
          sed -i "s/versionCode 1/versionCode ${N}/; s/versionName \"1.0\"/versionName \"1.0.${N}\"/" $G
          grep -n "versionCode\|versionName" $G

      - name: Add camera permission
        run: |
          MF=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application|' $MF
          grep -n "CAMERA" $MF

      - name: Add notification permissions
        run: |
          MF=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" android:maxSdkVersion="32" />\n    <application|' $MF
          grep -n "NOTIFICATIONS\|EXACT_ALARM" $MF

      - name: Add battery optimisation permission
        run: |
          MF=android/app/src/main/AndroidManifest.xml
          # Location and foreground-service permissions come from the background-geolocation plugin's own manifest.
          # This one lets the user exempt the app from battery optimisation so GPS tracking is not stopped.
          sed -i 's|<application|<uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />\n    <application|' $MF
          grep -n "BATTERY" $MF

      - name: Add full-screen reminder (native)
        run: |
          APP=android/app/src/main
          PKG=$APP/java/com/dopamine/fitness
          MF=$APP/AndroidManifest.xml
          cp android-native/java/*.java $PKG/
          cat > $PKG/MainActivity.java <<'JAVA'
          package com.dopamine.fitness;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(DopamineReminderPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA
          sed -i 's|<application|<uses-permission android:name=\"android.permission.USE_FULL_SCREEN_INTENT\" />\n    <application|' $MF
          sed -i 's|</application>|    <activity android:name=\".ReminderActivity\" android:exported=\"false\" android:showWhenLocked=\"true\" android:turnScreenOn=\"true\" android:excludeFromRecents=\"true\" android:launchMode=\"singleTask\" android:taskAffinity=\"\" />\n        <receiver android:name=\".ReminderReceiver\" android:exported=\"false\" />\n        <receiver android:name=\".ReminderDismissReceiver\" android:exported=\"false\" />\n    </application>|' $MF
          grep -n "FULL_SCREEN\|Reminder" $MF

      - name: Sign with the permanent key
        run: |
          cat >> android/app/build.gradle <<EOF

          android {
              signingConfigs {
                  debug {
                      storeFile file("${KEYSTORE_PATH}")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
          }
          EOF
          tail -14 android/app/build.gradle

      - name: Sync web assets
        run: npx cap sync android

      - name: Build APK
        shell: bash
        working-directory: android
        run: |
          chmod +x gradlew
          ok=0
          WP=gradle/wrapper/gradle-wrapper.properties
          cat $WP
          for attempt in 1 2 3 4; do
            echo "Build attempt $attempt"
            if [ "$attempt" = 2 ] || [ "$attempt" = 4 ]; then
              echo "Switching Gradle download to a mirror"
              sed -i 's|^distributionUrl=.*|distributionUrl=https\\://mirrors.cloud.tencent.com/gradle/gradle-8.2.1-bin.zip|' $WP
              grep distributionUrl $WP
            fi
            if ./gradlew assembleDebug 2>&1 | tee ../gradle.log; then ok=1; break; fi
            sleep 30
          done
          [ "$ok" = 1 ]

      - name: Report build errors
        if: failure()
        run: |
          MSG=$(grep -n -i -E "error|wrong|failed|exception|not found|cannot" gradle.log | head -40 | cut -c1-300 | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Gradle summary::${MSG}"

      - name: Package outputs
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Dopamine.apk
          EXPECTED="53:B5:65:08:97:1C:3B:30:78:75:BC:E7:30:8A:A3:93:BA:C4:6D:AD:87:DF:BE:93:B2:C7:7A:5D:99:F0:25:BB"
          ACTUAL=$(keytool -printcert -jarfile Dopamine.apk | grep -m1 "SHA256:" | sed 's/.*SHA256: *//')
          echo "APK signer SHA-256: $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error title=Wrong signing key::The APK is not signed with the Dopamine key, so it was not published."
            exit 1
          fi
          echo "Signature matches the permanent Dopamine key."

      - uses: actions/upload-artifact@v4
        with:
          name: Dopamine-apk
          path: Dopamine.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=${{ github.run_number }}
          printf 'Latest build of the Dopamine fitness app.\n\nbuild:%s\n' "$N" > notes.txt
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Dopamine.apk --title "Dopamine APK" --notes-file notes.txt --target ${{ github.sha }}
