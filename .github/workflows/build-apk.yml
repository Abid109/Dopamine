name: Build Dopamine APK

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'wiki/**'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - '.github/workflows/sync-wiki.yml'
  workflow_dispatch:

# Read-only by default; only the build job may publish the release.
permissions:
  contents: read

# Never publish two builds at once (they would fight over the "latest" release).
concurrency:
  group: build-latest-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Use the permanent signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error title=Signing key missing::Add the repository secret ANDROID_KEYSTORE_B64 (see the wiki page Updating the App). The build stops here so an APK signed with a random key is never published."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/dopamine.keystore"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/dopamine.keystore" >> "$GITHUB_ENV"
          keytool -list -keystore "$RUNNER_TEMP/dopamine.keystore" -storepass android -alias androiddebugkey | head -3

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Build the stylesheet
        run: npm run build:css

      - name: Add Android platform
        run: npx cap add android

      - name: Apply app icon and name
        run: |
          RES=android/app/src/main/res
          rm -f $RES/drawable-v24/ic_launcher_foreground.xml $RES/drawable/ic_launcher_background.xml
          rm -f $RES/mipmap-*/ic_launcher*.png $RES/mipmap-*/ic_launcher*.webp
          cp -r android-res/* $RES/
          sed -i 's|<string name="app_name">.*</string>|<string name="app_name">Dopamine</string>|; s|<string name="title_activity_main">.*</string>|<string name="title_activity_main">Dopamine</string>|' $RES/values/strings.xml

      - name: Set app version
        run: |
          N=${{ github.run_number }}
          G=android/app/build.gradle
          sed -i "s/versionCode 1/versionCode ${N}/; s/versionName \"1.0\"/versionName \"1.0.${N}\"/" $G
          grep -n "versionCode\|versionName" $G

      - name: Harden the app manifest
        run: |
          MF=android/app/src/main/AndroidManifest.xml
          # Turn off Android backup of app data (cloud backup and adb backup). Your data is kept with
          # Export JSON or by signing in. Remove this step to allow Android backups again.
          sed -i 's|android:allowBackup="true"|android:allowBackup="false"|' $MF
          if ! grep -q 'android:allowBackup="false"' $MF; then
            sed -i 's|<application|<application android:allowBackup="false"|' $MF
          fi
          if grep -q 'android:allowBackup="true"' $MF || [ "$(grep -c 'android:allowBackup=' $MF)" != "1" ]; then
            echo "::error title=Backup setting::android:allowBackup must be set to false exactly once."; exit 1
          fi
          if grep -q 'android:debuggable' $MF; then
            echo "::error title=Debuggable flag::The manifest must not set android:debuggable."; exit 1
          fi
          grep -n "allowBackup" $MF

      - name: Add camera permission
        run: |
          MF=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application|' $MF
          grep -n "CAMERA" $MF

      - name: Add notification permissions
        run: |
          MF=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" android:maxSdkVersion="32" />\n    <application|' $MF
          grep -n "NOTIFICATIONS\|EXACT_ALARM" $MF

      - name: Add battery optimisation permission
        run: |
          MF=android/app/src/main/AndroidManifest.xml
          # Location and foreground-service permissions come from the background-geolocation plugin's own manifest.
          # This one lets the user exempt the app from battery optimisation so GPS tracking is not stopped.
          sed -i 's|<application|<uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />\n    <application|' $MF
          grep -n "BATTERY" $MF

      - name: Add in-app update support
        run: |
          MF=android/app/src/main/AndroidManifest.xml
          # Lets the app open Android's installer for a downloaded update (the user still confirms there).
          sed -i 's|<application|<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n    <application|' $MF
          # UpdateFileProvider (copied with the other native files) shares the downloaded APK with the installer.
          sed -i 's|</application>|    <provider android:name=".UpdateFileProvider" android:authorities="${applicationId}.updates" android:exported="false" android:grantUriPermissions="true"><meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/update_paths" /></provider>\n    </application>|' $MF
          grep -n "INSTALL_PACKAGES\|UpdateFileProvider" $MF

      - name: Add full-screen reminder (native)
        run: |
          APP=android/app/src/main
          PKG=$APP/java/com/dopamine/fitness
          MF=$APP/AndroidManifest.xml
          cp android-native/java/*.java $PKG/
          cat > $PKG/MainActivity.java <<'JAVA'
          package com.dopamine.fitness;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(DopamineReminderPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA
          sed -i 's|<application|<uses-permission android:name=\"android.permission.USE_FULL_SCREEN_INTENT\" />\n    <application|' $MF
          sed -i 's|</application>|    <activity android:name=\".ReminderActivity\" android:exported=\"false\" android:showWhenLocked=\"true\" android:turnScreenOn=\"true\" android:excludeFromRecents=\"true\" android:launchMode=\"singleTask\" android:taskAffinity=\"\" />\n        <receiver android:name=\".ReminderReceiver\" android:exported=\"false\" />\n        <receiver android:name=\".ReminderDismissReceiver\" android:exported=\"false\" />\n    </application>|' $MF
          grep -n "FULL_SCREEN\|Reminder" $MF

      - name: Sign with the permanent key
        run: |
          cat >> android/app/build.gradle <<EOF

          android {
              signingConfigs {
                  dopamine {
                      storeFile file("${KEYSTORE_PATH}")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.dopamine
                      debuggable false
                      minifyEnabled false
                      shrinkResources false
                  }
              }
              lint {
                  checkReleaseBuilds false
                  abortOnError false
              }
          }
          EOF
          tail -26 android/app/build.gradle

      - name: Sync web assets
        run: npx cap sync android

      - name: Build APK
        shell: bash
        working-directory: android
        run: |
          chmod +x gradlew
          ok=0
          WP=gradle/wrapper/gradle-wrapper.properties
          cat $WP
          for attempt in 1 2 3 4; do
            echo "Build attempt $attempt"
            if [ "$attempt" = 2 ] || [ "$attempt" = 4 ]; then
              echo "Switching Gradle download to a mirror"
              sed -i 's|^distributionUrl=.*|distributionUrl=https\\://mirrors.cloud.tencent.com/gradle/gradle-8.2.1-bin.zip|' $WP
              grep distributionUrl $WP
            fi
            if ./gradlew assembleRelease 2>&1 | tee ../gradle.log; then ok=1; break; fi
            sleep 30
          done
          [ "$ok" = 1 ]

      - name: Report build errors
        if: failure()
        run: |
          MSG=$(grep -n -i -E "error|wrong|failed|exception|not found|cannot" gradle.log | head -40 | cut -c1-300 | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Gradle summary::${MSG}"

      - name: Package outputs
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error title=Release APK missing::Expected $APK. Contents:"; ls -R android/app/build/outputs/apk | head -20; exit 1
          fi
          cp "$APK" Dopamine.apk
          EXPECTED="53:B5:65:08:97:1C:3B:30:78:75:BC:E7:30:8A:A3:93:BA:C4:6D:AD:87:DF:BE:93:B2:C7:7A:5D:99:F0:25:BB"
          ACTUAL=$(keytool -printcert -jarfile Dopamine.apk | grep -m1 "SHA256:" | sed 's/.*SHA256: *//')
          echo "APK signer SHA-256: $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error title=Wrong signing key::The APK is not signed with the Dopamine key, so it was not published."
            exit 1
          fi
          echo "Signature matches the permanent Dopamine key."

      - name: Check the APK is a hardened release build
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -1)
          if [ -z "$BT" ]; then echo "::warning::Android build tools not found, skipping the APK checks."; exit 0; fi
          # The signature must be valid.
          if ! "$BT/apksigner" verify --print-certs Dopamine.apk > apksigner.log 2>&1; then
            cat apksigner.log; echo "::error title=Bad signature::apksigner could not verify the APK, so it was not published."; exit 1
          fi
          head -3 apksigner.log
          # It must not be debuggable.
          if ! "$BT/aapt2" dump badging Dopamine.apk > badging.log 2>&1; then
            cat badging.log; echo "::error title=APK unreadable::aapt2 could not read the APK."; exit 1
          fi
          if grep -q "application-debuggable" badging.log; then
            echo "::error title=Debuggable APK::The APK is debuggable, so it was not published."; exit 1
          fi
          "$BT/aapt2" dump xmltree --file AndroidManifest.xml Dopamine.apk | grep -i "allowBackup" || true
          echo "The APK is signed, valid and not debuggable."

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Dopamine-apk
          path: Dopamine.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=${{ github.run_number }}
          printf 'Latest build of the Dopamine fitness app.\n\nbuild:%s\n' "$N" > notes.txt
          # One-line summary of what changed, shown by the app's update prompt (merge commits keep the PR title in the body).
          MSG=$(git log -1 --pretty=%b | head -1)
          [ -z "$MSG" ] && MSG=$(git log -1 --pretty=%s)
          MSG=$(printf '%s' "$MSG" | tr -d '\r' | cut -c1-120)
          printf 'changes:%s\n' "$MSG" >> notes.txt
          # SHA-256 of the exact file that is uploaded. The app checks it before it opens the installer.
          SHA=$(sha256sum Dopamine.apk | cut -d' ' -f1)
          echo "APK SHA-256: $SHA"
          printf 'sha256:%s\n' "$SHA" >> notes.txt
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Dopamine.apk --title "Dopamine APK" --notes-file notes.txt --target ${{ github.sha }}
