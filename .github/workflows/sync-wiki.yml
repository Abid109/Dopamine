name: Sync wiki

on:
  push:
    branches: [main, master]
    paths: ['wiki/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Publish wiki pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if ! git clone "https://x-access-token:${TOKEN}@github.com/${REPO}.wiki.git" wiki-repo 2>/dev/null; then
            echo "::error title=Wiki not created yet::GitHub only creates the wiki after one page is saved in the browser. Open the Wiki tab, click 'Create the first page', save it, then re-run this workflow."
            exit 1
          fi
          rsync -a --delete --exclude '.git' wiki/ wiki-repo/
          cd wiki-repo
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki already up to date."
            exit 0
          fi
          git commit -m "Update wiki from repository"
          git push
