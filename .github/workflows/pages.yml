name: Deploy website

# Publishes the web app (PWA) at the site root, the download page at /download/ and the documentation
# (built from the wiki/ folder with MkDocs) at /docs/ on GitHub Pages.
# One-time setup: Settings, Pages, Source: GitHub Actions.

on:
  push:
    branches: [main, master]
    paths:
      - 'www/**'
      - 'site/**'
      - 'wiki/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Assemble the site
        run: |
          mkdir _site
          cp -r www/. _site/
          mkdir _site/download
          cp site/download/index.html _site/download/index.html
          touch _site/.nojekyll
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: site/docs/requirements.txt
      - name: Build the documentation site
        env:
          NO_MKDOCS_2_WARNING: '1'
        run: |
          pip install -r site/docs/requirements.txt
          python site/docs/build_docs.py --wiki wiki --out _site/docs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
