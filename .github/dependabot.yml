# Opens a pull request when a library or a GitHub Action has a new version.
# Merging a pull request that changes package.json rebuilds the app.
# Libraries copied into www/vendor/ (Leaflet, jsQR, qrcode-generator, supabase-js) are not tracked here:
# check them by hand now and then (see THIRD-PARTY-NOTICES.md).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Capacitor 6 and Tailwind 3 are pinned to their major versions on purpose: a new major
    # needs a code change and a test on a phone, so it is done by hand.
    ignore:
      - dependency-name: "@capacitor/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@capacitor-community/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps"
